<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursor Cloud Agent demo</title>
  <style>
    :root {
      --card-background: rgba(255, 255, 255, 0.94);
      --heading-color: #1b1b3a;
      --body-color: #3d3d5c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 52%, #f472b6 100%);
    }

    .card {
      width: min(28rem, calc(100% - 2rem));
      padding: 2.75rem 2rem;
      border-radius: 1.25rem;
      background: var(--card-background);
      box-shadow: 0 24px 60px rgba(20, 16, 60, 0.28);
      text-align: center;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 2.5rem;
      letter-spacing: -0.03em;
      color: var(--heading-color);
    }

    p {
      margin: 0;
      font-size: 1.125rem;
      line-height: 1.5;
      color: var(--body-color);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello</h1>
    <p>Welcome to the Cursor Cloud Agent demo.</p>
  </main>
</body>
</html>
